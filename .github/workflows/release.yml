name: Release

# Deploy dos instaladores (mac/Windows/Linux) num GitHub Release ao enviar uma
# tag "vX.Y.Z". Padrão robusto: cada SO só COMPILA e sobe os arquivos como
# artifacts (sem tocar no Release); um job final baixa tudo e cria UM Release
# atômico com todos os instaladores — assim nenhum job sobrescreve o do outro.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessário para criar o Release

jobs:
  # Portão de qualidade: nenhum instalador é compilado se a suíte quebrar.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Rodar a suíte de testes
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar instaladores (sem publicar)
        run: npx --no-install electron-builder --publish never

      - name: Subir artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar o Release com todos os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.deb artifacts/*.blockmap artifacts/latest*.yml)
          echo "Instaladores encontrados (${#files[@]}):"
          printf ' - %s\n' "${files[@]}"
          # NÃO recriar um Release incompleto. fail-fast:false deixa as pernas
          # boas subirem mesmo que uma falhe, e if-no-files-found:ignore deixa
          # uma perna "passar" sem produzir artefato. Sem esta checagem, o
          # gh release delete abaixo apagaria o Release bom e o recriaria sem,
          # por exemplo, o instalador Windows e o latest.yml — quebrando o
          # auto-update de quem já está instalado, com o workflow verde. Exige o
          # conjunto mínimo das três plataformas ANTES de tocar no Release.
          faltando=()
          compgen -G "artifacts/*.dmg"           > /dev/null || faltando+=("macOS .dmg")
          compgen -G "artifacts/*.exe"           > /dev/null || faltando+=("Windows .exe")
          compgen -G "artifacts/latest.yml"      > /dev/null || faltando+=("latest.yml (auto-update Windows)")
          { compgen -G "artifacts/*.AppImage" > /dev/null || compgen -G "artifacts/*.deb" > /dev/null; } \
            || faltando+=("Linux .AppImage/.deb")
          compgen -G "artifacts/latest-linux.yml" > /dev/null || faltando+=("latest-linux.yml (auto-update Linux)")
          if [ ${#faltando[@]} -ne 0 ]; then
            echo "Release INCOMPLETO — abortando sem tocar no Release existente. Faltam:"
            printf ' - %s\n' "${faltando[@]}"
            exit 1
          fi
          # recria o Release do zero (idempotente em re-execuções; mantém a tag)
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          printf '%s\n' \
            '## Instalação' \
            '' \
            '### macOS' \
            'O app não é assinado (sem certificado Apple), então na **primeira** abertura:' \
            '1. Clique com o **botão direito** no app → **Abrir** → **Abrir**.' \
            '2. Se aparecer *"está danificado"*, rode isto uma vez no Terminal e abra de novo:' \
            '   ```' \
            '   xattr -cr "/Applications/Vincii Canvas.app"' \
            '   ```' \
            '' \
            '### Windows / Linux' \
            'Windows: execute o instalador `Setup .exe`. Linux: `.AppImage` (dê permissão de execução) ou `.deb`.' \
            'Nas próximas versões, **Windows e Linux se atualizam automaticamente**.' \
            > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            "${files[@]}"
